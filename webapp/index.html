<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
     <!-- hier Favicons einfügen mit links  -->
    
    <title>Urban Virom Project</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="crossorigin=""/>     
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="crossorigin=""></script>
<style>
    * {
  box-sizing: border-box;
    }
    .page{
        display: none;
        text-align: center;
        font-size: 35px;
        padding: 30px;
    }
    .page.active{
        display: block;
    }
    
    header{
        min-height: 50px;
        text-align: center;
        font-size: 35px;
        padding: 30px;
    }
    header a {
        font-size: 30px;        
        padding: 20px;
        color: #01d5ff;        
        text-decoration: none; 
    }
    header a:hover {
        color: #ff00aa;        
    }
    
    .sidebar{
        text-align: left;
        width: 15%;
        background: #ccc;
        color: antiquewhite;
        padding: 20px;
    }
    .sidebar ul li a {
        font-size: 30px;        
        color: #161b1c;        
        text-decoration: none; 
    }
    .sidebar ul li a:hover {
        color: #ffffff;        
    }
    nav ul {
        list-style-type: none;
        padding: 0;
    }
    section{
        display: flex;
        height: 100%;
        align-items: stretch;
    }
    section.page.active {
    display: flex; 
    }

    article {
    display: none;
    
    padding: 10px;
    width: 85%;
    background-color: #756a76;
    
    }
    article.active{
        display: flex;
        flex-direction: column;
    }   
    #map-container{
        flex: 1;
        min-height: 340px;
        width: 100%;
        z-index: 0;
    }
</style>
</head>

<body class="theme-overall" style="background-color:#343434;color:rgb(251, 6, 235); margin: 30px;">
     <!-- ================= Header ================= -->
    <header>
        <span>Urban Virom</span>
        <small>-- Projekt</small>
        <nav id="navHeader">
        <a href="#" onclick="showPage('home')">Home</a>
        <a href="#" onclick="showPage('about')">About</a>
    </nav>
    </header>
     <!-- ================= Startseite ================= -->
    <section id="home" class="page active">
        <nav class="sidebar">
            <ul>
            <li><a href="#" onclick="showArticle('map')">Map</a></li>
            <li><a href="#" onclick="showArticle('plots')">Plots</a></li>
            <li><a href="#" onclick="showArticle('placeholder')">Placeholder</a></li>
            </ul>
        </nav>
        
        <article id="map" class="article active">
            <div id="map-container"></div>
        </article>
        <article id="plots">
            
        </article>
        <article id="placeholder">
            
        </article>
    </section>
    
    <!-- ================= Andere Seite ================= -->
     <div id="about" class="page">
        <h1>Über uns</h1>
        <p>Bla bla bla</p>

    </div>
    <!-- ================= funktionen ================= -->
    <script>
        function showArticle(articleId){
            const articles= document.querySelectorAll('article');
            articles.forEach(article => article.classList.remove('active'));
            document.getElementById(articleId).classList.add('active');
            if (articleId === 'map' && window.myMap) {
                setTimeout(() => window.myMap.invalidateSize(), 100);
            }
        }
        function showPage(pageId){
            const pages= document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
    </script>
    <!-- ================= sources ================= -->
    <script src="src/map.js"></script>    
    <!-- ================= 
    -logik für plotly  
    -logik für db einbettung 
    ================= -->
    </body>
</html>
