services:
  data-preparation:
    image: data-preparation:latest
    build: .
    command: snakemake --cores 10 report.txt
    volumes:
      - type: bind
        read_only: true
        source: ./database
        target: /snakemake/database
      - type: bind
        source: ./cities
        target: /snakemake/cities

  init-db:
    image: init-db
    build:
      dockerfile: ./database/initdb.Dockerfile
    command: ["./init_and_fill_db.sh"]
    volumes:
      - db-data:/app/data/db

  sqlite:
    image: sqlite
    build:
      dockerfile: ./database/sqlite.Dockerfile
    #command: ["tail", "-f", "/dev/null"]
    ports:
      - "5000:5000"
    volumes:
      - db-data:/db
    restart: unless-stopped
